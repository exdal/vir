[workspace]
resolver = "3"
members = [
  "vir",
  "vir-examples",
]

[workspace.dependencies]
ash = "0.38.0"
winit = "0.30.12"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
gpu-allocator = { version = "0.28.0", default-features = false, features = ["std", "vulkan"] }
bitflags = "2.10.0"
shader-slang = "0.1.0"
egui = "0.36.0"
egui-winit = "0.36.0"
image = { version = "0.25.8", default-features = false, features = ["png"] }
gltf = "1.4.1"
glam = "0.33.3"
